<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  :root { --line: #d9dce0; --muted: #5f6368; --hit: #e8f0fe; }
  body { font-family: Roboto, Arial, sans-serif; font-size: 12px; margin: 0; padding: 8px; color: #202124; }
  h2 { font-size: 13px; margin: 0 0 6px; }
  .origin { background: #f1f3f4; border-radius: 4px; padding: 6px; margin-bottom: 6px; word-break: break-all; }
  .origin code { font-family: 'Roboto Mono', Menlo, monospace; font-size: 11px; }
  .names { color: #0b8043; font-weight: 600; margin-bottom: 6px; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
  button { font-size: 12px; padding: 4px 8px; cursor: pointer; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border-bottom: 1px solid var(--line); padding: 3px 4px; text-align: left; vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--hit); }
  tbody.blank-alert { background: #ffffcc; }
  .swatch { display: inline-block; width: 12px; height: 12px; border: 1px solid #999; vertical-align: middle; }
  .flag { font-weight: 700; color: #c5221f; }
  .sub { font-family: 'Roboto Mono', Menlo, monospace; font-size: 10px; color: var(--muted); word-break: break-all; }
  .warn { background: #fce8e6; border-left: 3px solid #c5221f; padding: 5px; margin: 6px 0; }
  .note { color: var(--muted); font-size: 11px; margin-top: 6px; }
  .toggles label { display: block; margin: 2px 0; }
  #status { color: var(--muted); min-height: 14px; }
</style>
</head>
<body>

<div class="controls">
  <label><input type="radio" name="mode" value="precedents" checked> Precedents</label>
  <label><input type="radio" name="mode" value="dependents"> Dependents</label>
</div>

<div class="origin">
  <div><b id="originAddr">-</b></div>
  <code id="originFormula"></code>
</div>
<div class="names" id="names"></div>

<div class="controls">
  <button id="btnRefresh">New origin</button>
  <button id="btnBack" disabled>Back</button>
  <button id="btnRehide" style="display:none">Re-hide sheets</button>
</div>

<div id="status">Loading…</div>
<div id="warnings"></div>

<table>
  <thead>
    <tr><th>Sheet</th><th></th><th>Address</th><th>Value</th><th></th><th>Source</th></tr>
  </thead>
  <tbody id="rows"></tbody>
</table>

<details class="note">
  <summary>Options</summary>
  <div class="toggles">
    <label><input type="checkbox" id="showNamedRanges"> Show range names</label>
    <label><input type="checkbox" id="traverseHidden"> Include hidden sheets</label>
    <label><input type="checkbox" id="showExternal"> Show external (IMPORTRANGE) refs</label>
  </div>
</details>

<script>
  var navStack = [];
  var unhidden = [];
  var current = null;

  function mode() {
    return document.querySelector('input[name=mode]:checked').value;
  }

  function setStatus(text) {
    document.getElementById('status').textContent = text;
  }

  function audit(request, pushHistory) {
    setStatus('Scanning…');
    if (pushHistory && current) navStack.push(current);
    google.script.run
      .withSuccessHandler(render)
      .withFailureHandler(function (e) { setStatus('Error: ' + e.message); })
      .aceAudit(request);
  }

  function render(data) {
    current = { sheetName: data.origin.sheetName, a1: data.origin.a1, mode: data.mode };

    document.getElementById('originAddr').textContent =
      data.origin.sheetName + '!' + data.origin.a1 + '  =  ' + data.origin.value;
    document.getElementById('originFormula').textContent = data.origin.formula || '(no formula)';
    document.getElementById('names').textContent =
      data.namedRanges.length ? 'RANGE NAME: ' + data.namedRanges.join(' | ') : '';

    for (var key in data.settings) {
      var el = document.getElementById(key);
      if (el) el.checked = data.settings[key];
    }

    var warn = '';
    if (data.unresolved && data.unresolved.length) {
      warn += '<div class="warn"><b>Unresolved dynamic references (' +
        data.unresolved.length + ')</b> — these read cells this tool cannot work out ' +
        'without evaluating the formula:<ul>';
      data.unresolved.forEach(function (u) {
        warn += '<li><code>' + escapeHtml(u.raw) + '</code> — ' + escapeHtml(u.reason) + '</li>';
      });
      warn += '</ul></div>';
    }
    if (data.skippedSheets && data.skippedSheets.length) {
      warn += '<div class="warn"><b>Sheets not scanned:</b> ' +
        escapeHtml(data.skippedSheets.join(', ')) + '</div>';
    }
    document.getElementById('warnings').innerHTML = warn;

    var tbody = document.getElementById('rows');
    tbody.className = data.hasBlank ? 'blank-alert' : '';
    tbody.innerHTML = '';

    data.rows.forEach(function (row) {
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + escapeHtml(row.sheetName) + '</td>' +
        '<td class="flag">' + escapeHtml(row.flag) + '</td>' +
        '<td>' + escapeHtml(row.address) + '</td>' +
        '<td>' + escapeHtml(row.value) + '</td>' +
        '<td><span class="swatch" style="background:' + safeColour(row.background) + '"></span></td>' +
        '<td class="sub">' + escapeHtml(row.sourceFormula || row.subFormula) +
          (row.viaName ? ' <b>[' + escapeHtml(row.viaName) + ']</b>' : '') + '</td>';
      tr.onclick = function () { activate(row); };
      tbody.appendChild(tr);
    });

    setStatus(data.scanStats
      ? data.rows.length + ' dependent(s); scanned ' + data.scanStats.scannedFormulas +
        ' formulas in ' + data.scanStats.elapsedMs + ' ms'
      : data.rows.length + ' precedent(s) in ' + data.elapsedMs + ' ms');
    document.getElementById('btnBack').disabled = navStack.length === 0;
  }

  function activate(row) {
    if (row.external) {
      if (row.url) window.open(row.url, '_blank');
      else setStatus('That IMPORTRANGE source is not a plain https link.');
      return;
    }
    if (!row.jumpable) return;
    setStatus('Jumping…');
    google.script.run
      .withSuccessHandler(function (res) {
        if (res.unhidden && unhidden.indexOf(res.sheetName) < 0) {
          unhidden.push(res.sheetName);
          document.getElementById('btnRehide').style.display = '';
        }
        audit({ sheetName: res.sheetName, a1: res.a1, mode: mode() }, true);
      })
      .withFailureHandler(function (e) { setStatus('Error: ' + e.message); })
      .aceJump(row.sheetName, row.address);
  }

  function safeColour(value) {
    return /^#[0-9a-fA-F]{3,8}$/.test(String(value || '')) ? value : 'transparent';
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  document.getElementById('btnRefresh').onclick = function () {
    audit({ mode: mode() }, true);
  };

  document.getElementById('btnBack').onclick = function () {
    var prev = navStack.pop();
    if (!prev) return;
    google.script.run
      .withSuccessHandler(function () {
        audit({ sheetName: prev.sheetName, a1: prev.a1, mode: mode() }, false);
      })
      .aceJump(prev.sheetName, prev.a1);
  };

  document.getElementById('btnRehide').onclick = function () {
    google.script.run
      .withSuccessHandler(function (done) {
        unhidden = unhidden.filter(function (n) { return done.indexOf(n) < 0; });
        if (!unhidden.length) document.getElementById('btnRehide').style.display = 'none';
        setStatus('Re-hid ' + done.length + ' sheet(s).');
      })
      .aceRehide(unhidden);
  };

  Array.prototype.forEach.call(document.querySelectorAll('input[name=mode]'), function (el) {
    el.onchange = function () { audit(current ? { sheetName: current.sheetName, a1: current.a1, mode: mode() } : { mode: mode() }, false); };
  });

  ['showNamedRanges', 'traverseHidden', 'showExternal'].forEach(function (key) {
    document.getElementById(key).onchange = function () {
      google.script.run
        .withSuccessHandler(function () {
          audit(current ? { sheetName: current.sheetName, a1: current.a1, mode: mode() } : { mode: mode() }, false);
        })
        .aceSetSetting(key, this.checked);
    }.bind(document.getElementById(key));
  });

  audit(null, false);
</script>
</body>
</html>
