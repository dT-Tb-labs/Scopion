<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<base target="_top">
<style>
  :root {
    --blue: #1a73e8; --blue-bg: #e8f0fe;
    --border: #dadce0; --text: #202124; --muted: #5f6368;
    --surface: #fff; --card: #f8f9fa;
    --amber: #b06000; --amber-bg: #fef7e0;
    --red: #c5221f; --red-bg: #fce8e6;
    --green: #188038;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 0 34px;
    font-family: Roboto, Arial, sans-serif; font-size: 13px;
    color: var(--text); background: var(--surface); user-select: none;
  }
  .mono { font-family: 'Roboto Mono', Menlo, monospace; }

  header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; border-bottom: 1px solid var(--border);
  }
  header .brand { font-weight: 700; font-size: 14px; letter-spacing: .2px; }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
  header .dot.paused { background: #9aa0a6; }
  header .dot.error { background: var(--red); }
  .pill {
    margin-left: auto; border: 1px solid var(--border); border-radius: 999px;
    padding: 3px 10px; font-size: 11px; cursor: pointer; background: var(--surface);
  }
  .pill.on { background: var(--blue-bg); border-color: var(--blue); color: var(--blue); font-weight: 600; }

  .crumbs {
    display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
    padding: 6px 12px 0; font-size: 11px; color: var(--muted); min-height: 14px;
  }
  .crumbs .chip { cursor: pointer; color: var(--blue); }
  .crumbs .sep { color: var(--border); }

  .origin {
    margin: 8px 12px; padding: 9px 10px; background: var(--card);
    border: 1px solid var(--border); border-radius: 8px;
  }
  .origin .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .origin .addr { font-weight: 700; }
  .origin .val { color: var(--muted); font-variant-numeric: tabular-nums; }
  .origin .formula {
    margin-top: 5px; font-size: 11px; padding: 5px 6px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 4px;
    max-height: 56px; overflow: auto; word-break: break-all; user-select: text;
  }
  .origin .names { margin-top: 4px; font-size: 11px; color: var(--green); font-weight: 600; }

  .modes { display: flex; margin: 0 12px 6px; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .modes button {
    flex: 1; border: 0; background: var(--surface); padding: 5px 0; cursor: pointer;
    font-size: 12px; color: var(--muted);
  }
  .modes button.on { background: var(--blue-bg); color: var(--blue); font-weight: 600; }

  .warn { margin: 0 12px 6px; padding: 6px 8px; border-radius: 6px; font-size: 11px; }
  .warn.amber { background: var(--amber-bg); color: var(--amber); border-left: 3px solid var(--amber); }
  .warn.red { background: var(--red-bg); color: var(--red); border-left: 3px solid var(--red); }
  .warn ul { margin: 4px 0 0; padding-left: 16px; }
  .warn li { overflow-wrap: anywhere; }
  .warn .mono { user-select: text; word-break: break-all; }

  .listhead {
    display: flex; justify-content: space-between; align-items: center;
    padding: 2px 12px 4px; font-size: 11px; color: var(--muted);
  }
  .hint {
    color: var(--blue); cursor: pointer; border: 1px solid var(--blue);
    background: var(--blue-bg); border-radius: 999px; padding: 1px 8px;
    font-size: 10px; font-weight: 600; white-space: nowrap;
  }
  .hint:hover { background: #d2e3fc; }

  /* min-height keeps the keyboard target big even when the list is short or
     empty — handing the keyboard over must not require hitting a thin strip. */
  #list { outline: none; margin: 0 8px; border-radius: 8px; min-height: 120px; }
  #list:focus-visible, #list:focus {
    outline: 2px solid var(--blue); outline-offset: 0;
  }
  /* When the grid holds the keyboard, say so on the list itself rather than
     only in a small pill: a modeller pressing arrows and seeing nothing move
     needs the reason where they are looking. */
  #list.unfocused { cursor: pointer; }
  #list.unfocused::after {
    content: 'クリックすると ↑↓ で参照先を歩けます';
    display: block; margin: 6px 6px 0; padding: 5px 8px;
    background: var(--blue-bg); color: var(--blue);
    border-radius: 6px; font-size: 11px; text-align: center;
  }
  #list.blank-alert { background: #fffbe6; border-radius: 6px; }
  .row {
    position: relative; padding: 6px 8px 6px 14px; border-radius: 6px;
    cursor: pointer; margin-bottom: 2px;
  }
  .row:hover { background: #f1f3f4; }
  .row.active { background: var(--blue-bg); }
  .row.active::before {
    content: ''; position: absolute; left: 4px; top: 6px; bottom: 6px;
    width: 3px; border-radius: 2px; background: var(--blue);
  }
  .row .l1 { display: flex; align-items: baseline; gap: 6px; }
  .row .addr { font-weight: 600; font-size: 12px; }
  .row .val { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--text); }
  .row .swatch { width: 10px; height: 10px; border: 1px solid #bbb; border-radius: 2px; flex: none; align-self: center; }
  .badge {
    font-size: 9px; font-weight: 700; padding: 0 4px; border-radius: 3px; flex: none;
  }
  .badge.h { background: var(--red-bg); color: var(--red); }
  .badge.ex { background: #e1bee7; color: #6a1b9a; }
  .badge.blank { background: var(--amber-bg); color: var(--amber); }
  .row .l2 {
    margin-top: 1px; font-size: 10px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row.dead { opacity: .55; cursor: default; }

  .empty { padding: 18px 12px; color: var(--muted); font-size: 12px; text-align: center; }

  .chipbar { margin: 6px 12px; }
  .chipbar button {
    border: 1px solid var(--border); background: var(--surface); border-radius: 999px;
    padding: 3px 10px; font-size: 11px; cursor: pointer; margin-right: 6px;
  }

  details.opts { margin: 4px 12px; font-size: 11px; color: var(--muted); }
  details.opts label { display: block; margin: 3px 0; }

  footer {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; gap: 8px;
    padding: 5px 12px; background: var(--card); border-top: 1px solid var(--border);
    font-size: 10px; color: var(--muted);
  }
</style>
</head>
<body>

<header>
  <span class="dot" id="statusDot"></span>
  <span class="brand">Scopion</span>
  <button class="pill on" id="followPill">Follow</button>
</header>

<div class="crumbs" id="crumbs"></div>

<div class="origin" id="originCard" style="display:none">
  <div class="top"><span class="addr" id="originAddr"></span><span class="val" id="originVal"></span></div>
  <div class="formula mono" id="originFormula"></div>
  <div class="names" id="originNames"></div>
</div>

<div class="modes">
  <button id="modePrec" class="on">Precedents</button>
  <button id="modeDep">Dependents</button>
</div>

<div id="warnings"></div>

<div class="listhead">
  <span id="stats"></span>
  <button class="hint" id="focusHint" style="display:none" title="give the keyboard to the reference list">↑↓ で歩く</button>
</div>

<div id="list" role="listbox" tabindex="0" aria-label="References"></div>

<div class="chipbar" id="chipbar" style="display:none">
  <button id="btnRehide">隠しシートを戻す</button>
</div>

<div class="chipbar">
  <button id="btnHome">元のセルに戻る</button>
  <button id="btnClose">終了 (Esc)</button>
</div>

<details class="opts">
  <summary>Options</summary>
  <label><input type="checkbox" id="showNamedRanges"> Show range names</label>
  <label><input type="checkbox" id="traverseHidden"> Include hidden sheets</label>
  <label><input type="checkbox" id="showExternal"> Show IMPORTRANGE refs</label>
</details>

<footer>
  <span>↑↓ 移動 · ⏎ 掘る · ← 戻る · p/d 参照元/先 · esc 終了</span>
  <span id="pollLabel">following</span>
</footer>


<script>
// ---- in-browser Apps Script stand-in (real server code + mock spreadsheet) --
(function () {
function colToA(n) { let s = ''; while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); } return s; }
function parseA1(a1) {
  const m = /^\$?([A-Z]+)\$?(\d+)(?::\$?([A-Z]+)\$?(\d+))?$/i.exec(a1.replace(/\$/g, ''));
  if (!m) throw new Error('mock getRange: unsupported a1 "' + a1 + '"');
  const col = (s) => s.toUpperCase().split('').reduce((n, c) => n * 26 + c.charCodeAt(0) - 64, 0);
  return { r1: +m[2], c1: col(m[1]), r2: m[4] ? +m[4] : +m[2], c2: m[3] ? col(m[3]) : col(m[1]) };
}

class Range {
  constructor(sheet, r1, c1, nr, nc) { this.sheet = sheet; this.r1 = r1; this.c1 = c1; this.nr = nr; this.nc = nc; }
  _cell(dr, dc) { return this.sheet._cell(this.r1 + dr, this.c1 + dc); }
  getSheet() { return this.sheet; }
  getRow() { return this.r1; } getColumn() { return this.c1; }
  getLastRow() { return this.r1 + this.nr - 1; } getLastColumn() { return this.c1 + this.nc - 1; }
  getCell(r, c) { return new Range(this.sheet, this.r1 + r - 1, this.c1 + c - 1, 1, 1); }
  getNumRows() { return this.nr; }
  getNumColumns() { return this.nc; }
  getA1Notation() {
    const a = colToA(this.c1) + this.r1, b = colToA(this.c1 + this.nc - 1) + (this.r1 + this.nr - 1);
    return a === b ? a : a + ':' + b;
  }
  getFormula() { return this._cell(0, 0).formula; }
  getValue() { return this._cell(0, 0).value; }
  getDisplayValue() { const v = this._cell(0, 0).value; return v === '' || v === null ? '' : String(v); }
  getBackground() { return this._cell(0, 0).background; }
  setBackground(colour) {
    const r = this.r1, c = this.c1, sh = this.sheet;
    if (!sh.cells[r]) sh.cells[r] = {};
    if (!sh.cells[r][c]) sh.cells[r][c] = { formula: '', value: '', background: '#ffffff' };
    sh.cells[r][c].background = colour === null ? '#ffffff' : colour;
    return this;
  }
  _grid(pick) {
    const out = [];
    for (let r = 0; r < this.nr; r++) { const row = [];
      for (let c = 0; c < this.nc; c++) row.push(pick(this._cell(r, c)));
      out.push(row); }
    return out;
  }
  getFormulas() { return this._grid((c) => c.formula); }
  getValues() { return this._grid((c) => c.value); }
  getDisplayValues() { return this._grid((c) => (c.value === '' || c.value === null ? '' : String(c.value))); }
  getBackgrounds() { return this._grid((c) => c.background); }
}

class Sheet {
  constructor(name, cells, hidden) {
    this.name = name; this.cells = cells; this.hidden = !!hidden;
    this.sheetId = [...name].reduce((a, c) => a * 31 + c.charCodeAt(0) & 0xffff, 7);
  }
  getSheetId() { return this.sheetId; }
  _cell(r, c) { return (this.cells[r] && this.cells[r][c]) || { formula: '', value: '', background: '#ffffff' }; }
  getName() { return this.name; }
  isSheetHidden() { return this.hidden; }
  showSheet() { this.hidden = false; } hideSheet() { this.hidden = true; }
  activate() { this.parent.active = this; }
  getLastRow() { return Math.max(0, ...Object.keys(this.cells).map(Number)); }
  getMaxRows() { return this.maxRows || 1000; }      // a new Google sheet is 1000 x 26
  getMaxColumns() { return this.maxCols || 26; }
  getLastColumn() {
    let max = 0;
    for (const r of Object.keys(this.cells)) max = Math.max(max, ...Object.keys(this.cells[r]).map(Number));
    return max;
  }
  getDataRange() { return new Range(this, 1, 1, Math.max(this.getLastRow(), 1), Math.max(this.getLastColumn(), 1)); }
  getRange(a, b, c, d) {
    if (typeof a === 'string') { const p = parseA1(a); return new Range(this, p.r1, p.c1, p.r2 - p.r1 + 1, p.c2 - p.c1 + 1); }
    return new Range(this, a, b, c || 1, d || 1);
  }
}

class Spreadsheet {
  constructor(sheets, names) {
    this.sheets = sheets; sheets.forEach((s) => { s.parent = this; });
    this.names = names || []; this.active = sheets[0]; this.activeRange = sheets[0].getRange('A1');
  }
  getId() { return 'mock'; }
  getSheets() { return this.sheets; }
  getSheetByName(n) { return this.sheets.find((s) => s.name === n) || null; }
  getActiveSheet() { return this.active; }
  getActiveRange() { return this.activeRange; }
  setActiveRange(r) { this.activeRange = r; this.active = r.sheet; return r; }
  getNamedRanges() { return this.names; }
}

/** cells: {"1": {"1": "=A2", ...}} — a string is a formula if it starts with "=". */
function sheetOf(name, spec, hidden) {
  const cells = {};
  for (const r of Object.keys(spec)) {
    cells[r] = {};
    for (const c of Object.keys(spec[r])) {
      const raw = spec[r][c];
      const isFormula = typeof raw === 'string' && raw.charAt(0) === '=';
      cells[r][c] = {
        formula: isFormula ? raw : '',
        value: isFormula ? (spec[r][c + '.value'] !== undefined ? spec[r][c + '.value'] : 0) : raw,
        background: '#ffffff'
      };
    }
  }
  return new Sheet(name, cells, hidden);
}



const inputs = sheetOf('Inputs', {
  1: { 1: 'Growth', 2: 0.05 },
  2: { 1: 'Base', 2: 100 },
  3: { 1: 'Shift', 2: 1 },
  4: { 1: 'Empty', 2: '' }
});
const hidden = sheetOf('Hidden Calc', { 1: { 1: 7 }, 2: { 1: 8 }, 3: { 1: 9 } }, true);
const model = sheetOf('Model', {
  1: { 1: "=Inputs!B2*(1+Inputs!B1)" },
  2: { 1: "=OFFSET('Hidden Calc'!A1,Inputs!B3,0)" },
  3: { 1: '=INDEX(Inputs!B1:B4,4)' },
  4: { 1: '=A1+A2' },
  5: { 1: '=INDIRECT("Inputs!B2")' },
  6: { 1: '=SUM(Inputs!B1:B3)' },
  7: { 1: '=OFFSET(Inputs!B1,MATCH(1,Inputs!A:A,0),0)' }
});
const ss = new Spreadsheet([model, inputs, hidden], [
  { getName: () => 'Growth', getRange: () => inputs.getRange('B1') },
  { getName: () => 'Shift', getRange: () => inputs.getRange('B3') }
]);
ss.setActiveRange(model.getRange('A2'));
window.__ss = ss; // test hook: Playwright inspects grid state through this

const props = {};
window.PropertiesService = {
  getDocumentProperties: () => ({
    getProperty: (k) => (k in props ? props[k] : null),
    setProperty: (k, v) => { props[k] = v; }
  })
};
window.SpreadsheetApp = { getActive: () => ss };
window.Logger = { log: () => {} };

// ---- real server code -------------------------------------------------------
/**
 * Formula.gs — pure formula text parsing. No SpreadsheetApp calls live here,
 * so every function in this file is testable from Test.gs without a document.
 *
 * Port note: the Excel original found precedents with Range.NavigateArrow, which
 * Apps Script has no equivalent of. Everything a precedent walk used to give us
 * has to come out of the formula string instead, which is what this file does.
 */

var MAX_COL = 18278; // Google Sheets column limit (ZZZ)
var MAX_ROW = 10000000;

var TOK = {
  STRING: 'STRING',
  SHEET: 'SHEET',     // a sheet qualifier, i.e. the "Sheet1!" part
  REF: 'REF',         // an A1 reference or range
  FUNC: 'FUNC',       // an identifier immediately followed by "("
  NAME: 'NAME',       // a bare identifier: named-range candidate
  NUMBER: 'NUMBER',
  PUNCT: 'PUNCT'      // ( ) , ; and operators
};

function isDigit(c) { return c >= '0' && c <= '9'; }
function isAlpha(c) { return (c >= 'A' && c <= 'Z') || (c >= 'a' && c <= 'z'); }
function isIdentChar(c) { return isAlpha(c) || isDigit(c) || c === '_' || c === '.' || c === '$'; }

function colToNum(letters) {
  var n = 0;
  for (var i = 0; i < letters.length; i++) {
    n = n * 26 + (letters.toUpperCase().charCodeAt(i) - 64);
  }
  return n;
}

function numToCol(n) {
  var s = '';
  while (n > 0) {
    var r = (n - 1) % 26;
    s = String.fromCharCode(65 + r) + s;
    n = Math.floor((n - 1) / 26);
  }
  return s;
}

/**
 * Parse one side of a reference ("$A$1", "A", "1") into {col, row}, either of
 * which may be null for a whole-column ("A") or whole-row ("1") reference.
 * Returns null when the text is not a reference at all.
 */
function parseRefPart(text) {
  var m = /^\$?([A-Za-z]{1,3})?\$?([0-9]{1,8})?$/.exec(text);
  if (!m || (!m[1] && !m[2])) return null;
  var col = m[1] ? colToNum(m[1]) : null;
  var row = m[2] ? parseInt(m[2], 10) : null;
  if (col !== null && (col < 1 || col > MAX_COL)) return null;
  if (row !== null && (row < 1 || row > MAX_ROW)) return null;
  return { col: col, row: row };
}

/** True when text is a self-contained A1 reference such as "B7" or "$B$7". */
function isFullCellRef(text) {
  var p = parseRefPart(text);
  return !!(p && p.col !== null && p.row !== null);
}

/**
 * Tokenize a formula. The leading "=" is optional.
 *
 * A character scanner rather than a regex, because the same characters mean
 * different things depending on the state we are in:
 *   =IF(A1="B2",...)        the "B2" inside the string literal is not a reference
 *   ='O''Connor'!A1         the doubled quote is one literal quote, not a close
 *   =LOG10(A1)              LOG10 is a valid A1 address; only the "(" says otherwise
 *   =SUM(TaxRate)           TaxRate is a named range, not an address
 */
function tokenize(formula) {
  var tokens = [];
  if (!formula) return tokens;
  var s = String(formula);
  if (s.charAt(0) === '=') s = s.substring(1);
  var i = 0;

  while (i < s.length) {
    var c = s.charAt(i);

    if (c === ' ' || c === '\t' || c === '\n' || c === '\r') { i++; continue; }

    // String literal, "" is an escaped quote.
    if (c === '"') {
      var str = '';
      i++;
      while (i < s.length) {
        if (s.charAt(i) === '"') {
          if (s.charAt(i + 1) === '"') { str += '"'; i += 2; continue; }
          i++;
          break;
        }
        str += s.charAt(i); i++;
      }
      tokens.push({ type: TOK.STRING, value: str });
      continue;
    }

    // Quoted sheet name, '' is an escaped quote. Only a qualifier when "!" follows.
    if (c === "'") {
      var name = '';
      var j = i + 1;
      while (j < s.length) {
        if (s.charAt(j) === "'") {
          if (s.charAt(j + 1) === "'") { name += "'"; j += 2; continue; }
          j++;
          break;
        }
        name += s.charAt(j); j++;
      }
      if (s.charAt(j) === '!') {
        tokens.push({ type: TOK.SHEET, value: name, raw: s.substring(i, j) });
        i = j + 1;
      } else {
        // A stray quoted run that is not a sheet qualifier. Skip it rather than
        // letting its contents be scanned as references.
        tokens.push({ type: TOK.STRING, value: name });
        i = j;
      }
      continue;
    }

    if (isIdentChar(c)) {
      var start = i;
      var ident = '';
      while (i < s.length && isIdentChar(s.charAt(i))) { ident += s.charAt(i); i++; }

      // 1E+10 stops at the sign above; pull the exponent back in so it stays a
      // number instead of becoming the named-range candidate "1E".
      if (/^[0-9.]+[eE]$/.test(ident) && /[-+]/.test(s.charAt(i)) && isDigit(s.charAt(i + 1))) {
        ident += s.charAt(i); i++;
        while (i < s.length && isDigit(s.charAt(i))) { ident += s.charAt(i); i++; }
      }

      // Sheet qualifier: Sheet1!A1
      if (s.charAt(i) === '!') {
        tokens.push({ type: TOK.SHEET, value: ident, raw: ident });
        i++;
        continue;
      }

      // Function call: the "(" is what distinguishes LOG10( from cell LOG10.
      if (s.charAt(i) === '(') {
        tokens.push({ type: TOK.FUNC, value: ident.toUpperCase(), start: start });
        continue; // leave "(" for the punct branch so bracket depth still counts it
      }

      // Range: A1:B2, A:A, 1:1. The right side may carry its own sheet qualifier
      // (Sheet1!A1:Sheet1!B2), which we drop — a range cannot span two sheets.
      if (s.charAt(i) === ':') {
        var k = i + 1;
        var rightIdent = '';
        // The right side may repeat the sheet qualifier, quoted or not
        // ('Sheet 1'!A1:'Sheet 1'!B10). A range cannot span two sheets, so the
        // repeat is skipped rather than parsed.
        if (s.charAt(k) === "'") {
          var q = k + 1;
          while (q < s.length) {
            if (s.charAt(q) === "'") {
              if (s.charAt(q + 1) === "'") { q += 2; continue; }
              q++;
              break;
            }
            q++;
          }
          if (s.charAt(q) === '!') k = q + 1;
        }
        while (k < s.length && isIdentChar(s.charAt(k))) { rightIdent += s.charAt(k); k++; }
        if (s.charAt(k) === '!') {
          k++;
          rightIdent = '';
          while (k < s.length && isIdentChar(s.charAt(k))) { rightIdent += s.charAt(k); k++; }
        }
        if (parseRefPart(ident) && parseRefPart(rightIdent)) {
          tokens.push({ type: TOK.REF, value: ident + ':' + rightIdent, start: start });
          i = k;
          continue;
        }
        // Not a range after all (e.g. a named range before a ":" typo). Fall through.
      }

      if (/^[0-9.]+$/.test(ident) || /^[0-9.]+[eE][+-]?[0-9]+$/.test(ident)) {
        tokens.push({ type: TOK.NUMBER, value: ident });
      } else if (isFullCellRef(ident)) {
        tokens.push({ type: TOK.REF, value: ident, start: start });
      } else if (/^(TRUE|FALSE)$/i.test(ident)) {
        tokens.push({ type: TOK.NUMBER, value: ident });
      } else {
        tokens.push({ type: TOK.NAME, value: ident, start: start });
      }
      continue;
    }

    tokens.push({ type: TOK.PUNCT, value: c });
    i++;
  }

  return tokens;
}

/**
 * Extract every reference a formula reads, as {sheet, a1, kind, raw}.
 * `sheet` is null when the reference is unqualified (same sheet as the formula).
 * `kind` is 'ref' | 'name' | 'external'.
 *
 * Dynamic targets (OFFSET/INDEX/INDIRECT) are NOT resolved here — Trace.gs does

    if (resolved && !reason && callBase && !rectWithin(resolved, callBase)) {
      resolved = null;
      reason = 'index falls outside the range (Sheets returns #REF!)';
    }
    out.push({ rect: resolved, raw: call.text, reason: reason, dynamic: true, pos: call.index });
  }
  return out;
}

// ---------------------------------------------------------------------------
// Precedents / dependents
// ---------------------------------------------------------------------------

function findPrecedents(ss, sheetName, a1, namedRanges) {
  var values = new ValueCache(ss);
  var sheet = ss.getSheetByName(sheetName);
  var formula = sheet.getRange(a1).getFormula();
  var targets = [];
  var unresolved = [];

  if (formula) {
    var refs = extractRefs(formula);
    for (var i = 0; i < refs.length; i++) {
      var ref = refs[i];
      if (ref.kind === 'external') {
        targets.push({ external: true, url: ref.url, a1: ref.a1, raw: ref.raw, pos: ref.pos || 0 });
        continue;
      }
      if (ref.kind === 'name' && !namedRanges[ref.a1.toUpperCase()]) continue; // a function we do not know, not a name
      var r = refToRect(ref, sheetName, namedRanges);
      if (r) targets.push({ rect: r, raw: ref.raw, pos: ref.pos || 0,
                            viaName: ref.kind === 'name' ? ref.a1 : '' });
    }

    var dyn = resolveDynamicTargets(formula, sheetName, values, namedRanges);
    for (var d = 0; d < dyn.length; d++) {
      if (dyn[d].rect) {
        targets.push({ rect: dyn[d].rect, raw: dyn[d].raw, dynamic: true, pos: dyn[d].pos || 0 });
      } else {
        unresolved.push({ raw: dyn[d].raw, reason: dyn[d].reason });
      }
    }

    // Reading order. A modeller checks a formula left to right, so the walk
    // must follow the formula, not the order the resolver happened to produce
    // (static refs first, dynamic targets appended). A dynamic call sorts at
    // the position of the call itself, so OFFSET(...)'s resolved target sits
    // where OFFSET is written, ahead of its own arguments.
    targets = targets.map(function (t, i) { return { t: t, i: i }; })
      .sort(function (a, b) {
        var d = (a.t.pos || 0) - (b.t.pos || 0);
        return d !== 0 ? d : a.i - b.i;
      })
      .map(function (w) { return w.t; });
  }

  return { formula: formula, targets: targets, unresolved: unresolved };
}

/**
 * Scan every sheet's formulas and return the cells whose references cover the
 * target. No pre-built index: one getFormulas() call per sheet, parsed in
 * memory. The elapsed time is reported to the UI so the cost is visible rather
 * than assumed — add an index only if these numbers justify one.
 */
function findDependents(ss, targetSheetName, a1, namedRanges) {
  var values = new ValueCache(ss);
  var target = a1ToRect(a1, targetSheetName);
  var sheets = ss.getSheets();
  var targets = [];
  var skipped = [];
  var started = Date.now();
  var scannedFormulas = 0;

  for (var s = 0; s < sheets.length; s++) {
    var sheet = sheets[s];
    var sheetName = sheet.getName();

    if (Date.now() - started > SCAN_DEADLINE_MS) {
      skipped.push(sheetName + ' (time limit)');
      continue;
    }
    if (sheet.getLastRow() === 0) continue;
    if (sheetTooLarge(sheet)) {
      skipped.push(sheetName + ' (' + (sheet.getLastRow() * sheet.getLastColumn()) + ' cells)');
      continue;
    }

    var formulas = sheet.getDataRange().getFormulas();
    for (var r = 0; r < formulas.length; r++) {
      if ((r & 255) === 0 && Date.now() - started > SCAN_DEADLINE_MS) {
        skipped.push(sheetName + ' (time limit, stopped at row ' + (r + 1) + ')');
        break;
      }
      var row = formulas[r];
      for (var c = 0; c < row.length; c++) {
        var f = row[c];
        if (!f) continue;
        scannedFormulas++;

        var refs = extractRefs(f);
        var hit = null;
        for (var i = 0; i < refs.length && !hit; i++) {
          if (refs[i].kind === 'external') continue;
          if (refs[i].kind === 'name' && !namedRanges[refs[i].a1.toUpperCase()]) continue;
          var rr = refToRect(refs[i], sheetName, namedRanges);
          if (rr && rectsOverlap(rr, target)) hit = refs[i].raw;
        }

        // A dependency can also be created dynamically; resolve those only for
        // formulas that mention one of the dynamic functions, to keep the scan cheap.
        if (!hit && /OFFSET\s*\(|INDEX\s*\(|INDIRECT\s*\(/i.test(f)) {
          var dyn = resolveDynamicTargets(f, sheetName, values, namedRanges);
          for (var d = 0; d < dyn.length && !hit; d++) {
            if (dyn[d].rect && rectsOverlap(dyn[d].rect, target)) hit = dyn[d].raw;
          }
        }

        if (hit) {
          targets.push({
            rect: rect(sheetName, r + 1, c + 1, r + 1, c + 1),
            raw: hit,
            sourceFormula: f
          });
        }
      }
    }
  }

  return {
    targets: targets,
    skipped: skipped,
    elapsedMs: Date.now() - started,
    scannedFormulas: scannedFormulas
  };
}

/** True when `inner` sits entirely inside `outer`. */
function rectWithin(inner, outer) {
  return inner.sheetName === outer.sheetName &&
    inner.r1 >= outer.r1 && inner.r2 <= outer.r2 &&
    inner.c1 >= outer.c1 && inner.c2 <= outer.c2;
}

function rectsOverlap(a, b) {
  return a.sheetName === b.sheetName &&
    a.r1 <= b.r2 && b.r1 <= a.r2 &&
    a.c1 <= b.c2 && b.c1 <= a.c2;
}

/**
 * @OnlyCurrentDoc
 *
 * Code.gs — entry points and the RPC surface the Scopion sidebar calls.
 *
 * Scopion: a formula auditor for Google Sheets, descended from the Excel VBA
 * add-in "ACE" (PwC, 2002-2012). The Excel original hung off a hotkey;
 * Marketplace add-ons cannot register shortcuts, so Scopion is a persistent
 * sidebar that FOLLOWS the grid selection (scopionObserve polling) and gives
 * arrow-key walking of the reference list once the sidebar has focus.
 */

var SETTING_KEYS = ['showExternal', 'traverseHidden', 'showNamedRanges', 'followMode'];
var BLANK_LABEL = '---BLANK CELL---';
var WALK_HIGHLIGHT = '#ccff90'; // the Excel original painted the walked cell ColorIndex 4

function onOpen() {
  // AuthMode.NONE-safe: menu construction only, no spreadsheet reads.
  SpreadsheetApp.getUi()
    .createMenu('Scopion')
    .addItem('Open Scopion', 'showScopionSidebar')
    .addToUi();
}

function onInstall(e) {
  onOpen(e);
}

function showScopionSidebar() {
  var html = HtmlService.createHtmlOutputFromFile('Sidebar')
    .setTitle('Scopion');
  SpreadsheetApp.getUi().showSidebar(html);
}

/** Macro alias for the bound-script build (Ctrl+Alt+Shift+1). */
function scopionOpen() {
  showScopionSidebar();
}

// ---------------------------------------------------------------------------
// Settings (DocumentProperties; the Excel original used workbook defined names)
// ---------------------------------------------------------------------------

function scopionGetSettings() {
  var out = {};
  var props = null;
  try {
    props = PropertiesService.getDocumentProperties();
  } catch (e) {
    // view-only access: no document properties, fall through to defaults
  }
  for (var i = 0; i < SETTING_KEYS.length; i++) {
    var raw = props ? props.getProperty('scopion.' + SETTING_KEYS[i]) : null;
    out[SETTING_KEYS[i]] = raw === null ? true : raw === 'true';
  }
  return out;
}

function scopionSetSetting(key, value) {
  if (SETTING_KEYS.indexOf(key) < 0) throw new Error('Unknown setting: ' + key);
  // Best-effort: a viewer without edit rights cannot persist settings; the
  // sidebar keeps its in-memory state, so failing loudly here would only
  // break the toggle for read-only users.
  try {
    PropertiesService.getDocumentProperties()
      .setProperty('scopion.' + key, value ? 'true' : 'false');
  } catch (e) {}
  return scopionGetSettings();
}

// ---------------------------------------------------------------------------
// Selection identity: sheetId:row:col. Immutable against sheet renames, which
// a name-keyed protocol would silently mis-resolve mid-session.
// ---------------------------------------------------------------------------

function sheetById(ss, sheetId) {
  var sheets = ss.getSheets();
  for (var i = 0; i < sheets.length; i++) {
    if (sheets[i].getSheetId() === sheetId) return sheets[i];
  }
  return null;
}

function selectionInfo(ss) {
  var range = ss.getActiveRange();
  if (!range) return null;
  var sheet = range.getSheet();
  var cell = range.getCell(1, 1); // multi-cell selections audit the top-left
  return {
    key: sheet.getSheetId() + ':' + cell.getRow() + ':' + cell.getColumn(),
    sheetId: sheet.getSheetId(),
    sheetName: sheet.getName(),
    row: cell.getRow(),
    column: cell.getColumn(),
    a1: cell.getA1Notation(),
    isSingleCell: range.getNumRows() === 1 && range.getNumColumns() === 1
  };
}

/**
 * The follow-mode poll. Cheap when nothing changed; when the selection HAS
 * changed it captures the coordinates and returns the full audit in the same
 * round trip — a separate peek-then-audit pair would race against the user
 * moving again in between.
 */
function scopionObserve(request) {
  var ss = SpreadsheetApp.getActive();
  // A sidebar that was closed mid-walk leaves a painted cell behind. The first
  // poll of a new session clears it.
  if (request && request.firstRun) scopionClearHighlight();
  var sel = selectionInfo(ss);
  if (!sel) return { changed: false, selection: null };
  if (request && request.knownKey === sel.key) {
    return { changed: false, selection: { key: sel.key } };
  }
  var audit = scopionAuditCore({
    sheetName: sel.sheetName,
    a1: sel.a1,
    mode: request && request.mode
  });
  return { changed: true, selection: sel, audit: audit };
}

/**
 * The walk highlight is owned by the DOCUMENT, not the sidebar.
 *
 * A sidebar reload (or simply closing and reopening it) used to orphan the
 * painted cell forever, because only the client remembered what to restore.
 * Keeping the record in DocumentProperties means any later run — including the
 * next boot — can clean it up.
 */
function readHighlightRecord() {
  try {
    var raw = PropertiesService.getDocumentProperties().getProperty('scopion.hl');
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function writeHighlightRecord(record) {
  try {
    var props = PropertiesService.getDocumentProperties();
    if (record) props.setProperty('scopion.hl', JSON.stringify(record));
    else props.deleteProperty('scopion.hl');
  } catch (e) {}
}

/**
 * Restore one previously highlighted cell to its recorded background.
 * Failures (protected range, deleted sheet) are swallowed: losing a restore
 * must never break navigation.
 */
function restoreHighlight(ss, restore) {
  if (!restore || !restore.target || restore.target.sheetId == null) return;
  try {
    var sheet = sheetById(ss, restore.target.sheetId);
    if (!sheet) return;
    var cell = sheet.getRange(restore.target.row, restore.target.column);
    if (restore.background && restore.background !== '#ffffff') {
      cell.setBackground(restore.background);
    } else {
      cell.setBackground(null);
    }
  } catch (e) {}
}

/** Standalone restore, for ending a walk without another jump. */
function scopionClearHighlight() {
  var record = readHighlightRecord();
  if (record) {
    restoreHighlight(SpreadsheetApp.getActive(), record);
    writeHighlightRecord(null);
  }
  return true;
}

/**
 * Navigation. action "jump" moves the grid selection only (arrow-key walking);
 * "navigateAndAudit" moves it AND audits the target as the new origin in one
 * round trip (Enter drill-in / Back).
 */
function scopionNavigate(request) {
  if (!request || (request.action !== 'jump' && request.action !== 'navigateAndAudit')) {
    throw new Error('Unknown navigation action.');
  }
  var ss = SpreadsheetApp.getActive();
  var sheet = sheetById(ss, request.target.sheetId);
  if (!sheet) throw new Error('Sheet no longer exists.');
  var row = Math.floor(request.target.row);
  var column = Math.floor(request.target.column);
  if (!(row >= 1) || !(column >= 1) ||
      row > sheet.getMaxRows() || column > sheet.getMaxColumns()) {
    throw new Error('Target is outside the grid.');
  }

  var unhidden = false;
  if (sheet.isSheetHidden()) {
    sheet.showSheet();
    unhidden = true;
  }
  sheet.activate();
  var range = sheet.getRange(row, column);
  ss.setActiveRange(range);

  // Walk highlight: paint the landed-on cell so the eye finds it instantly
  // (the selection outline alone is easy to lose on a dense model). The
  // previous walked cell is restored in the same round trip; the client keeps
  // the single {target, background} record and sends it back on the next hop.
  var highlight = null;
  if (request.highlight && request.highlight.apply) {
    restoreHighlight(ss, readHighlightRecord()); // whatever is painted now
    try {
      var prevBackground = range.getBackground();
      // Never remember our own highlight as the cell's "real" colour. A walk
      // that was interrupted (sidebar closed, script updated) leaves the paint
      // behind; without this guard the next walk records green as the original
      // and faithfully restores green — the cell could never go back.
      if (prevBackground === WALK_HIGHLIGHT) prevBackground = null;
      range.setBackground(WALK_HIGHLIGHT);
      writeHighlightRecord({
        target: { sheetId: sheet.getSheetId(), row: row, column: column },
        background: prevBackground
      });
      highlight = { applied: true };
    } catch (e) {
      writeHighlightRecord(null);
      highlight = { applied: false }; // protected range
    }
  } else if (request.highlight) {
    restoreHighlight(ss, readHighlightRecord());
    writeHighlightRecord(null);
    highlight = { applied: false };
  }

  var selection = {
    key: sheet.getSheetId() + ':' + row + ':' + column,
    sheetId: sheet.getSheetId(),
    sheetName: sheet.getName(),
    row: row,
    column: column,
    a1: range.getA1Notation(),
    sheetWasUnhidden: unhidden,
    highlight: highlight
  };

  if (request.action === 'navigateAndAudit') {
    return {
      selection: selection,
      audit: scopionAuditCore({
        sheetName: sheet.getName(),
        a1: range.getA1Notation(),
        mode: request.mode
      })
    };
  }
  return { selection: selection };
}

/** Mode switches / refresh on the current origin (no navigation). */
function scopionAudit(request) {
  // Prefer the immutable target: a sheetName captured before a rename would
  // resolve to "No such sheet" even though the sheet still exists.
  if (request && request.target && request.target.sheetId != null) {
    var sheet = sheetById(SpreadsheetApp.getActive(), request.target.sheetId);
    if (!sheet) throw new Error('Sheet no longer exists.');
    return scopionAuditCore({
      sheetName: sheet.getName(),
      a1: sheet.getRange(request.target.row, request.target.column).getA1Notation(),
      mode: request.mode
    });
  }
  return scopionAuditCore(request);
}

// ---------------------------------------------------------------------------
// Audit
// ---------------------------------------------------------------------------

/**
 * @param {?Object} request {sheetName, a1, mode} — omit to audit the current
 *   selection. `mode` is 'precedents' or 'dependents'.
 */
function scopionAuditCore(request) {
  var started = Date.now();
  var ss = SpreadsheetApp.getActive();
  var settings = scopionGetSettings();
  var mode = (request && request.mode) === 'dependents' ? 'dependents' : 'precedents';

  var sheetName, a1;
  if (request && request.sheetName) {
    var validated = validateTarget(ss, request.sheetName, request.a1);
    sheetName = validated.sheetName;
    // Audit the top-left cell: getRange() rejects the unbounded "C:C" form, and
    // a range has no single formula to report anyway.
    var box = a1ToRect(validated.a1, sheetName);
    a1 = numToCol(box.c1) + box.r1;
  } else {
    var active = ss.getActiveRange();
    if (!active) throw new Error('Select a cell first.');
    sheetName = active.getSheet().getName();
    a1 = active.getCell(1, 1).getA1Notation();
  }

  var namedRanges = buildNamedRangeMap(ss);
  var originSheet = ss.getSheetByName(sheetName);
  var originCell = originSheet.getRange(a1);

  var found, unresolved = [], skipped = [], scanStats = null;
  if (mode === 'precedents') {
    found = findPrecedents(ss, sheetName, a1, namedRanges);
    unresolved = found.unresolved;
  } else {
    var dep = findDependents(ss, sheetName, a1, namedRanges);
    found = { formula: originCell.getFormula(), targets: dep.targets };
    skipped = dep.skipped;
    scanStats = { elapsedMs: dep.elapsedMs, scannedFormulas: dep.scannedFormulas };
  }

  var visible = {};
  var sheets = ss.getSheets();
  for (var s = 0; s < sheets.length; s++) visible[sheets[s].getName()] = !sheets[s].isSheetHidden();

  var targets = found.targets;
  if (!settings.traverseHidden) {
    targets = targets.filter(function (t) {
      return t.external || visible[t.rect.sheetName] !== false;
    });
  }
  if (!settings.showExternal) {
    targets = targets.filter(function (t) { return !t.external; });
  }

  var rows = materializeRows(ss, targets, visible);

  // Navigation identity for each row (sheetId:row:col of the row's top-left).
  var idBySheet = {};
  var allSheets = ss.getSheets();
  for (var sIdx = 0; sIdx < allSheets.length; sIdx++) {
    idBySheet[allSheets[sIdx].getName()] = allSheets[sIdx].getSheetId();
  }
  for (var rIdx = 0; rIdx < rows.length; rIdx++) {
    var rw = rows[rIdx];
    if (rw.external || !rw.jumpable) continue;
    var box = a1ToRect(rw.address, rw.sheetName);
    if (box && idBySheet[rw.sheetName] !== undefined) {
      rw.target = { sheetId: idBySheet[rw.sheetName], row: box.r1, column: box.c1 };
    } else {
      rw.jumpable = false;
    }
  }

  var originSheetId = null;
  var origSheets = ss.getSheets();
  for (var oIdx = 0; oIdx < origSheets.length; oIdx++) {
    if (origSheets[oIdx].getName() === sheetName) { originSheetId = origSheets[oIdx].getSheetId(); break; }
  }
  var originBox = a1ToRect(a1, sheetName);
  return {
    origin: {
      sheetName: sheetName,
      sheetId: originSheetId,
      a1: a1,
      key: originSheetId + ':' + originBox.r1 + ':' + originBox.c1,
      target: { sheetId: originSheetId, row: originBox.r1, column: originBox.c1 },
      formula: found.formula || '',
      value: displayValue(originCell)
    },
    mode: mode,
    rows: rows,
    unresolved: unresolved,
    skippedSheets: skipped,
    scanStats: scanStats,
    namedRanges: settings.showNamedRanges ? namesCovering(namedRanges, sheetName, a1) : [],
    hasBlank: rows.some(function (r) { return r.isBlank; }),
    settings: settings,
    elapsedMs: Date.now() - started
  };
}

/** Reject anything from the browser that is not a real sheet and a legal A1 range. */
function validateTarget(ss, sheetName, a1) {
  var sheet = ss.getSheetByName(String(sheetName));
  if (!sheet) throw new Error('No such sheet: ' + sheetName);
  var r = a1ToRect(String(a1), sheet.getName());
  if (!r) throw new Error('Not a valid reference: ' + a1);
  // A formula may reference a cell outside the current grid (a deleted row, a
  // sheet that shrank). getRange() throws there, so it is caught here instead.
  if (r.r1 > sheet.getMaxRows() || r.c1 > sheet.getMaxColumns()) {
    throw new Error(a1 + ' is outside the grid of "' + sheet.getName() + '".');
  }
  return { sheetName: sheet.getName(), a1: String(a1).replace(/\$/g, '') };
}

/** Defined names whose range covers the audited cell (the original's txtNames box). */
function namesCovering(namedRanges, sheetName, a1) {
  var cell = a1ToRect(a1, sheetName);
  var out = [];
  for (var key in namedRanges) {
    var nr = namedRanges[key];
    if (rectsOverlap(nr.rect, cell)) out.push(nr.name);
  }
  return out;
}

/**
 * Read value, background and formula for every target, batching by sheet.
 * One getValues/getBackgrounds/getFormulas per sheet when the targets' bounding
 * box is small enough, otherwise per target — a formula referencing both A1 and
 * ZZ100000 would otherwise pull the whole sheet.
 */
function materializeRows(ss, targets, visible) {
  var bySheet = {};
  var rows = [];

  for (var i = 0; i < targets.length; i++) {
    var t = targets[i];
    if (t.external) {
      rows.push({
        index: i, external: true, sheetName: '(external)', flag: 'EX',
        address: t.a1, value: '', background: '', subFormula: t.raw,
        url: safeUrl(t.url), isBlank: false, jumpable: false
      });
      continue;
    }
    if (!bySheet[t.rect.sheetName]) bySheet[t.rect.sheetName] = [];
    bySheet[t.rect.sheetName].push({ index: i, target: t });
  }

  for (var sheetName in bySheet) {
    var sheet = ss.getSheetByName(sheetName);
    var items = bySheet[sheetName];
    if (!sheet) {
      for (var m = 0; m < items.length; m++) {
        rows.push(missingSheetRow(items[m], sheetName));
      }
      continue;
    }

    var maxRow = Math.max(sheet.getLastRow(), 1);
    var maxCol = Math.max(sheet.getLastColumn(), 1);
    var box = boundingBox(items, maxRow, maxCol);
    var useBatch = box && (box.r2 - box.r1 + 1) * (box.c2 - box.c1 + 1) <= MAX_MATERIALIZE_BBOX;

    var values = null, backgrounds = null, formulas = null;
    if (useBatch) {
      var range = sheet.getRange(box.r1, box.c1, box.r2 - box.r1 + 1, box.c2 - box.c1 + 1);
      values = range.getDisplayValues();
      backgrounds = range.getBackgrounds();
      formulas = range.getFormulas();
    }

    for (var k = 0; k < items.length; k++) {
      var item = items[k];
      var rct = item.target.rect;
      var isRange = rct.r1 !== rct.r2 || rct.c1 !== rct.c2;

      // Beyond the used range there is nothing to read. Clamping to the last
      // used cell would show a different cell's value under the right address.
      var withinGrid = rct.r1 <= sheet.getMaxRows() && rct.c1 <= sheet.getMaxColumns();
      if (rct.r1 > maxRow || rct.c1 > maxCol) {
        rows.push({
          index: item.index, external: false, sheetName: sheetName,
          flag: visible[sheetName] === false ? 'H' : '',
          address: rectToA1(rct), value: BLANK_LABEL,
          background: '', subFormula: item.target.raw || '',
          viaName: item.target.viaName || '', dynamic: !!item.target.dynamic,
          sourceFormula: item.target.sourceFormula || '',
          // A range entirely outside the used area is empty too, and an empty
          // referenced range is exactly the modelling error the alert is for.
          isBlank: true, jumpable: withinGrid
        });
        continue;
      }
      var r = rct.r1, c = rct.c1;

      var display, background, formula;
      if (useBatch) {
        display = values[r - box.r1][c - box.c1];
        background = backgrounds[r - box.r1][c - box.c1];
        formula = formulas[r - box.r1][c - box.c1];
      } else {
        var cellRange = sheet.getRange(r, c);
        display = cellRange.getDisplayValue();
        background = cellRange.getBackground();
        formula = cellRange.getFormula();
      }

      // "Blank" means structurally empty. A formula returning "" displays as
      // empty but is not a missing input, so it must not raise the alert.
      var isBlank = !isRange && display === '' && formula === '';

      rows.push({
        index: item.index,
        external: false,
        sheetName: sheetName,
        flag: visible[sheetName] === false ? 'H' : '',
        address: rectToA1(rct),
        value: isBlank ? BLANK_LABEL : (isRange ? '(' + rectToA1(rct) + ')' : display),
        background: background,
        subFormula: item.target.raw || '',
        viaName: item.target.viaName || '',
        dynamic: !!item.target.dynamic,
        sourceFormula: item.target.sourceFormula || '',
        isBlank: isBlank,
        jumpable: true
      });
    }
  }

  rows.sort(function (a, b) { return a.index - b.index; });
  return rows;
}

function missingSheetRow(item, sheetName) {
  return {
    index: item.index, external: false, sheetName: sheetName, flag: '?',
    address: rectToA1(item.target.rect), value: '(sheet not found)',
    background: '', subFormula: item.target.raw || '', isBlank: false, jumpable: false
  };
}

function boundingBox(items, maxRow, maxCol) {
  var r1 = null, c1 = null, r2 = null, c2 = null;
  for (var i = 0; i < items.length; i++) {
    var rct = items[i].target.rect;
    if (rct.r1 > maxRow || rct.c1 > maxCol) continue; // handled as blank, never read
    var r = rct.r1, c = rct.c1;
    r1 = r1 === null ? r : Math.min(r1, r);

<script>

// State. One machine: FOLLOWING <-> WALKING, with navigationBusy gating polls.
// ---------------------------------------------------------------------------
var S = {
  mode: 'precedents',
  audit: null,            // last AuditResult
  rows: [],               // jumpable view of audit.rows
  activeIndex: -1,        // roving highlight
  history: [],            // stack of {target:{sheetId,row,column}, label:"Sheet!A1"}
  unhidden: [],           // sheet names this session unhid
  settings: null,

  // follow loop
  follow: true,
  lastSeenKey: null,      // last selection key the poller observed
  suppressedKey: null,    // our own jump's landing key — poller ignores it
  echoExpiry: 0,          // transit window: polls landing mid-jump are ignored
  navCount: 0,            // navigation RPCs in flight (jump+drill can overlap) -> no polling
  generation: 0,          // bumped by every user navigation; stale polls drop
  pollTimer: null,
  pollBusy: false,
  lastChangeAt: Date.now(),
  lastInteractAt: Date.now(),
  failStreak: 0,
  sleeping: false,

  // walk highlight: the one cell currently painted, with its original
  // background, so every hop (and the end of the walk) can restore it
  painted: false,         // is a walk cell currently painted?

  // jump queue (latest-wins, single flight, never auto-retried)
  desiredTarget: null,
  committedTarget: null,
  jumpInFlight: false,
  jumpTimer: null

var POLL_FAST = 800, POLL_WARM = 1500, POLL_IDLE = 4000;
var WARM_AFTER = 8000, IDLE_AFTER = 30000, SLEEP_AFTER = 15 * 60 * 1000;

function rpc(name) {
  var args = Array.prototype.slice.call(arguments, 1);

      .withSuccessHandler(resolve)
      .withFailureHandler(reject);

// selection change.

// document.hidden === true at all times (sandboxed iframe), so the Page
// Visibility API can never gate this loop — a hidden-check here halts
// polling permanently. Background suppression is therefore idle backoff +
// deep sleep only.
// ---------------------------------------------------------------------------

  clearTimeout(S.pollTimer);
  if (!S.follow || S.sleeping) return;
  var since = Date.now() - S.lastChangeAt;
  var base = since < WARM_AFTER ? POLL_FAST : since < IDLE_AFTER ? POLL_WARM : POLL_IDLE;
  var jitter = (Math.random() - 0.5) * 500;

      // changed:false forever and freeze the sidebar on a stale origin

// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------
function requestJump(target, noPaint) {

  var row = S.rows[i];
  if (!row) return;

    if (row.url) window.open(row.url, '_blank');
    return;
  }

  else if (k === 'ArrowUp' || k === 'k') { setActive(S.activeIndex - 1, true); }
  else if (k === 'PageDown') { setActive(S.activeIndex + 10, true); }
  else if (k === 'PageUp') { setActive(S.activeIndex - 10, true); }
  else if (k === 'Home') { setActive(0, true); }
  else if (k === 'End') { setActive(S.rows.length - 1, true); }
  else if (k === 'Enter' || k === 'ArrowRight') {
    // Never a silent no-op: with no row selected yet, act on the first one.
    if (S.activeIndex < 0 && S.rows.length) setActive(0, /*jump=*/false);
    if (S.activeIndex >= 0) activateRow(S.activeIndex);

  else if (k === 'ArrowLeft' || k === 'Backspace') { goBack(); }
  else if (k === 'Escape') { closeScopion(); }
  else if (k === 'p') { setMode('precedents'); }
  else if (k === 'd') { setMode('dependents'); }

  ev.preventDefault();

window.addEventListener('focus', updateFocusHint);
$('list').addEventListener('focus', function () {
  if (S.rows.length && S.activeIndex < 0) setActive(0, /*jump=*/false);
  updateFocusHint();
});
$('list').addEventListener('blur', function () { setTimeout(updateFocusHint, 50); });
$('focusHint').onclick = function () { refocusList(); };
$('list').addEventListener('mousedown', function () { refocusList(); });

function updateFocusHint() {
  var owns = document.activeElement === $('list');
  $('focusHint').style.display = owns || !S.rows.length ? 'none' : '';
  $('list').classList.toggle('unfocused', !owns && S.rows.length > 0);
}

// ---------------------------------------------------------------------------
// Modes / settings / chips
// ---------------------------------------------------------------------------
function setMode(mode) {
  if (S.mode === mode || !S.audit) return;
  S.mode = mode;
  $('modePrec').className = mode === 'precedents' ? 'on' : '';
  $('modeDep').className = mode === 'dependents' ? 'on' : '';
  var o = S.audit.origin;
  var gen = ++S.generation;
  rpc('scopionAudit', { target: o.target, mode: mode })
    .then(function (audit) {
      if (gen !== S.generation) return; // superseded by newer navigation
      acceptAudit(audit, true);
    })
    .catch(toastError);
}
$('modePrec').onclick = function () { setMode('precedents'); };
$('modeDep').onclick = function () { setMode('dependents'); };

$('followPill').onclick = function () {
  S.follow = !S.follow;
  this.className = 'pill' + (S.follow ? ' on' : '');
  $('pollLabel').textContent = S.follow ? 'following' : 'paused';
  setStatus(S.follow ? 'ok' : 'paused');
  rpc('scopionSetSetting', 'followMode', S.follow).catch(function () {});
  if (S.follow) { S.sleeping = false; pollNow(); }
  else clearTimeout(S.pollTimer);
};

$('btnRehide').onclick = function () {
  rpc('scopionRehide', S.unhidden, S.audit ? S.audit.origin.target : null).then(function (done) {
    S.unhidden = S.unhidden.filter(function (n) { return done.indexOf(n) < 0; });
    if (!S.unhidden.length) $('chipbar').style.display = 'none';
  }).catch(toastError);
};

$('btnHome').onclick = function () {
  if (S.audit) { clearHighlight(); requestJump(S.audit.origin.target, true); }
};

$('btnClose').onclick = closeScopion;

['showNamedRanges', 'traverseHidden', 'showExternal'].forEach(function (key) {
  $(key).onchange = function () {
    var checked = this.checked;
    // The save is best-effort: a viewer without edit rights cannot write
    // DocumentProperties, but the re-audit must still run for them.
    rpc('scopionSetSetting', key, checked).catch(function () {}).then(function () {
      if (!S.audit) return;
      var o = S.audit.origin;
      var gen = ++S.generation;
      rpc('scopionAudit', { target: o.target, mode: S.mode })
        .then(function (audit) {
          if (gen !== S.generation) return;
          // Deliberate: a form-control-initiated render does not steal focus
          // from the control (SOL flagged this against the stated policy;
          // the policy is refined instead: only LIST-initiated renders focus
          // the list).
          acceptAudit(audit, false);
        })
        .catch(toastError);
    });
  };
});

// ---------------------------------------------------------------------------
// Boot: settings, then first observe (no knownKey -> immediate audit).
// ---------------------------------------------------------------------------
$('pollLabel').textContent = 'starting…';
rpc('scopionGetSettings').then(function (settings) {
  S.settings = settings;
  S.follow = settings.followMode !== false;
  $('followPill').className = 'pill' + (S.follow ? ' on' : '');
  ['showNamedRanges', 'traverseHidden', 'showExternal'].forEach(function (key) {
    if ($(key)) $(key).checked = settings[key];
  });
  return rpc('scopionObserve', { knownKey: null, mode: S.mode, firstRun: true });
}).then(function (res) {
  $('pollLabel').textContent = S.follow ? 'following' : 'paused';
  if (res && res.selection) {
    S.lastSeenKey = res.selection.key;
    if (res.audit) acceptAudit(res.audit, true);
  }
  // The sidebar was opened by a deliberate user action; claim the keyboard so
  // the promise "shortcut, then arrows" holds without an extra click.
  refocusList();
  scheduleNextPoll();
}).catch(function (e) {
  toastError(e);
  $('pollLabel').textContent = 'boot failed — following will retry';
  scheduleNextPoll();
});
</script>
</body>
</html>
