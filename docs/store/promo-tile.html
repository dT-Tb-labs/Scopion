<!doctype html>
<!-- Source of docs/store/assets/promo-440x280.png. Render:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
       --window-size=440,280 --screenshot=docs/store/assets/promo-440x280.png docs/store/promo-tile.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
  body {
    background: radial-gradient(120% 110% at 18% 40%, #2a3b8f 0%, #141c4d 45%, #070b24 100%);
    color: #fff; font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    display: flex; align-items: center; gap: 26px; padding: 0 34px; box-sizing: border-box;
  }
  .glow { position: absolute; left: 40px; top: 60px; width: 160px; height: 160px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,176,96,.28), rgba(255,176,96,0) 70%); }
  img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 18px 40px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.12); position: relative; }
  h1 { margin: 0 0 6px; font-size: 34px; letter-spacing: -.02em; line-height: 1; }
  p { margin: 0; color: rgba(255,255,255,.82); font-size: 15px; }
  p b { color: #ffd28a; font-weight: 600; }
  .keys { margin-top: 14px; display: flex; gap: 6px; }
  .keys span { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; background: rgba(255,255,255,.12); border-radius: 6px; padding: 3px 8px; color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.18); }
</style>
</head>
<body>
  <div class="glow"></div>
  <img src="../../extension/icons/scorpio.svg" alt="">
  <div>
    <h1>Scopion</h1>
    <p>Trace a formula's inputs<br>in <b>Google Sheets</b>.<br>Walk every referenced cell.</p>
    <div class="keys"><span>Ctrl+Shift+A</span><span>↑ ↓ walk</span><span>→ drill</span></div>
  </div>
</body>
</html>
